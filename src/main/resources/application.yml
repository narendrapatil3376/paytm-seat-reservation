server:
  port: 8080

spring:
  application:
    name: seat-reservation

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seat_reservation}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:India@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

    open-in-view: false

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  health:
    db:
      enabled: true

jwt:
  secret: "${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRMb25nU2VjcmV0S2V5Rm9ySldUMjU2}"
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}",
      "level":"%p",
      "thread":"%t",
      "logger":"%logger",
      "requestId":"%X{requestId}",
      "message":"%m"}%n